#
# docker compose -f docker-compose.yml up -d postgres
# docker compose -f docker-compose.yml down postgres
#
# docker exec -it postgresql psql -h postgresql.sandbox.net -U postgres -d SANDBOXDB
# docker exec -it postgresql psql -h postgresql.sandbox.net -U postgres -d SANDBOXDB
#

# Use postgres/example user/password credentials
# psql -h postgres.sandbox.net -U $POSTGRES_USER -d $POSTGRES_DB
# psql -h postgres.sandbox.net -U $POSTGRES_USER -d $POSTGRES_DB -W $POSTGRES_ADMIN_PASSWORD
# CREATE EXTENSION vector;
# SELECT * FROM pg_extension;
# CREATE TABLE items (id bigserial PRIMARY KEY, embedding vector(3));
# INSERT INTO items (embedding) VALUES ('[1,2,3]'), ('[4,5,6]');
# SELECT * FROM items ORDER BY embedding <-> '[3,1,2]' LIMIT 5;
# SELECT * FROM items ORDER BY embedding <-> '[3,1,2]' LIMIT 5;

services:
  #
  # Postgres Server
  #
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgresql
    hostname: postgresql.sandbox.net
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    ports:
      - "5432:5432"    
    volumes:
      - sandbox_apps_path:/apps
      - /apps/sandbox/postgres/data:/var/lib/postgresql/data
      - ./conf/postgres/my-postgres.conf:/etc/postgresql/postgresql.conf
      #- ./conf/postgres/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
    secrets:
      - postgres-passwd    
    env_file:
      - ./conf/postgres/envvars
      

  # adminer:
  #   image: adminer
  #   restart: always
  #   ports:
  #     - 8080:8080

#
secrets:
  postgres-passwd:
    file: ./conf/postgres/password.txt

#
volumes:
  #
  sandbox_apps_path:
    external: true

#
networks:
  default:
    external: true
    driver: bridge
    name: sandbox.net